name: docs-rejected-r7
description: >-
  The docs job's commit is refused by R7 because the dev code holds a credential; it returns the work with
  the hook output, a new dev job fixes the code, and the next docs job commits code and docs together.
project:
  platform: backend
inventory:
  skills: [api-design]
request:
  title: Đọc cấu hình
scripts:
  - stage: assistant_triage
    steps: [{ macro: triage, title: Đọc cấu hình }]
  - stage: pm_analyze
    steps:
      - macro: pm_analyze
        subtasks:
          - { title: Đọc cấu hình từ env, complexity: trivial, qcComplexity: trivial }
  - stage: dev
    title: Đọc cấu hình từ env
    run: 1
    steps:
      - macro: dev
        file: src/config.js
        content: "exports.key = process.env.KEY ?? '@{fakeSecret}';\n"
  - stage: docs_update
    title: Đọc cấu hình từ env
    run: 1
    steps: [{ macro: docs_update, files: [src/config.js], reject: true }]
  - stage: dev
    title: Đọc cấu hình từ env
    run: 2
    steps:
      - macro: dev_finish
        file: src/config.js
        content: "exports.key = process.env.KEY ?? '';\n"
  - stage: docs_update
    title: Đọc cấu hình từ env
    run: 2
    steps: [{ macro: docs_update, files: [src/config.js], message: 'feat: đọc cấu hình từ env' }]
  - stage: qc
    steps: [{ macro: qc }]
  - stage: pm_accept
    steps: [{ macro: pm_accept }]
  - stage: assistant_close
    steps: [{ macro: close }]
expect:
  tickets:
    - { title: '^Đọc cấu hình$', type: request, status: in_review }
    - { title: '^Đọc cấu hình$', type: pm_task, status: done }
    - { title: '^Đọc cấu hình từ env$', status: done }
