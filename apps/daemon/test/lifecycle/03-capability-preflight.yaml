name: capability-preflight
description: >-
  Every role runs the capability preflight and records its picks with reasons; the PM reads a design through
  a Figma MCP, QC of a web project gets Playwright automatically, and a skill the dev picked but never used
  is flagged (the PM accepts the dev's justification at merge).
inventory:
  skills: [requirements, planning, code-review, api-design, brainstorm, testing]
  mcpServers: [{ name: playwright }, { name: figma }]
request:
  title: Làm trang giỏ hàng
  description: Thiết kế ở Figma, file "cart".
scripts:
  - stage: assistant_triage
    steps: [{ macro: triage, title: Làm trang giỏ hàng, skills: [requirements] }]
  - stage: pm_analyze
    steps:
      - macro: preflight
        skills: [requirements, planning]
        mcps: [figma]
      - tool: mcp__figma__browser_navigate
        input: { url: 'figma://cart' }
      - macro: pm_analyze
        subtasks: [{ title: Trang giỏ hàng, skills: [api-design] }]
  - stage: dev
    title: Trang giỏ hàng
    steps:
      - macro: dev_start
        skills: [api-design, brainstorm]
        invoke: [api-design]
      - tool: mcp__tickets__comment
        input: { body: 'Skill brainstorm không cần vì yêu cầu đã rõ.' }
      - macro: dev_finish
        file: src/cart.js
  - stage: docs_update
    title: Trang giỏ hàng
    steps: [{ macro: docs_update, files: [src/cart.js], skills: [api-design] }]
  - stage: qc
    steps: [{ macro: qc, skills: [testing], mcps: [playwright] }]
  - stage: pm_accept
    steps: [{ macro: pm_accept, skills: [code-review], exceptions: [Trang giỏ hàng] }]
  - stage: assistant_close
    steps: [{ macro: close, skills: [requirements], badPick: health-endpoints }]
expect:
  tickets:
    - { title: '^Làm trang giỏ hàng$', type: request, status: in_review }
    - { title: '^Làm trang giỏ hàng$', type: pm_task, status: done }
    - { title: '^QC: Trang giỏ hàng$', status: done }
