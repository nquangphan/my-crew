name: qc-two-bugs
description: >-
  QC files two bugs; each bug ticket runs dev then docs-update on its own branch from the dev head, the paired
  retests pass, and PM accept merges the dev and both fixes (their generated docs blocks are regenerated).
project:
  platform: backend
request:
  title: Giỏ hàng
scripts:
  - stage: assistant_triage
    steps: [{ macro: triage, title: Giỏ hàng }]
  - stage: pm_analyze
    steps:
      - macro: pm_analyze
        subtasks:
          - { title: Tính tổng giỏ hàng, complexity: trivial, qcComplexity: trivial }
  - stage: dev
    title: '^Tính tổng giỏ hàng$'
    steps: [{ macro: dev, file: src/cart.js }]
  - stage: docs_update
    title: '^Tính tổng giỏ hàng$'
    steps: [{ macro: docs_update, files: [src/cart.js] }]
  - stage: qc
    title: '^QC: Tính tổng'
    steps: [{ macro: qc, bugs: [Lỗi A làm tròn, Lỗi B số âm] }]
  - stage: dev
    title: '^Lỗi A'
    steps: [{ macro: dev, file: src/fix-a.js }]
  - stage: docs_update
    title: '^Lỗi A'
    steps: [{ macro: docs_update, files: [src/fix-a.js], position: top }]
  - stage: dev
    title: '^Lỗi B'
    steps: [{ macro: dev, file: src/fix-b.js }]
  - stage: docs_update
    title: '^Lỗi B'
    steps: [{ macro: docs_update, files: [src/fix-b.js], position: bottom }]
  - stage: qc
    title: '^Kiểm thử lại'
    steps: [{ macro: qc }]
  - stage: pm_accept
    steps: [{ macro: pm_accept }]
  - stage: assistant_close
    steps: [{ macro: close }]
expect:
  tickets:
    - { title: '^Giỏ hàng$', type: pm_task, status: done }
    - { title: '^Lỗi', type: bug, status: done, count: 2 }
    - { title: '^Kiểm thử lại', status: done, count: 2 }
