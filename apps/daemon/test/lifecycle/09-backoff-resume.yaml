name: backoff-resume
description: >-
  A rate limit parks the dev job in backoff with a retry_at; when it is due the same job resumes its session
  and finishes the work.
project:
  platform: backend
fastForwardBackoff: true
request:
  title: Trang giới thiệu
scripts:
  - stage: assistant_triage
    steps: [{ macro: triage, title: Trang giới thiệu }]
  - stage: pm_analyze
    steps: [{ macro: pm_analyze, subtasks: [{ title: Trang giới thiệu }] }]
  - stage: dev
    steps:
      - macro: dev_start
      - apiErrorOnce: rate_limit
      - macro: dev_finish
        file: src/about.js
  - stage: docs_update
    steps: [{ macro: docs_update, files: [src/about.js] }]
  - stage: qc
    steps: [{ macro: qc }]
  - stage: pm_accept
    steps: [{ macro: pm_accept }]
  - stage: assistant_close
    steps: [{ macro: close }]
expect:
  tickets:
    - { title: '^Trang giới thiệu$', type: pm_task, status: done }
    - { title: '^Trang giới thiệu$', type: dev, status: done }
