name: child-cap
description: >-
  The PM hits the project's child cap mid-breakdown: the server parks the pm_task for the owner and the run
  stops; the owner approves in a comment, which lifts the cap for the whole tree, and the PM finishes.
project:
  platform: backend
  maxChildren: 2
request:
  title: Hai trang tĩnh
owner:
  - when: { title: '^Hai trang tĩnh$', type: pm_task, status: needs_input, comment: 'giới hạn' }
    comment: Đồng ý vượt giới hạn cho việc này.
scripts:
  - stage: assistant_triage
    steps: [{ macro: triage, title: Hai trang tĩnh }]
  - stage: pm_analyze
    run: 1
    steps:
      - macro: pm_analyze
        subtasks:
          - { title: Trang A, complexity: trivial, qcComplexity: trivial }
          - { title: Trang B, complexity: trivial, qcComplexity: trivial }
  - stage: pm_analyze
    run: 2
    steps:
      - macro: pm_analyze
        continued: true
        subtasks:
          - { title: Trang B, complexity: trivial, qcComplexity: trivial }
  - stage: dev
    title: Trang A
    steps: [{ macro: dev, file: src/beta.js }]
  - stage: docs_update
    title: Trang A
    steps: [{ macro: docs_update, files: [src/beta.js], position: top }]
  - stage: dev
    title: Trang B
    steps: [{ macro: dev, file: src/bravo.js }]
  - stage: docs_update
    title: Trang B
    steps: [{ macro: docs_update, files: [src/bravo.js], position: bottom }]
  - stage: qc
    steps: [{ macro: qc }]
  - stage: pm_monitor
    steps: [{ macro: pm_monitor }]
  - stage: pm_accept
    steps: [{ macro: pm_accept }]
  - stage: assistant_close
    steps: [{ macro: close }]
expect:
  tickets:
    - { title: '^Hai trang tĩnh$', type: pm_task, status: done }
    - { title: '^Trang [AB]$', type: dev, status: done, count: 2 }
