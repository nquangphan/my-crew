name: pm-rejects
description: >-
  A dev run reads source before docs and skips its required skill: merge_and_push refuses to merge, the PM
  rejects the ticket, which creates a bug ticket with a paired retest; after the fix the PM merges and pushes.
project:
  platform: backend
inventory:
  skills: [api-design]
request:
  title: Trang đơn hàng
scripts:
  - stage: assistant_triage
    steps: [{ macro: triage, title: Trang đơn hàng }]
  - stage: pm_analyze
    steps: [{ macro: pm_analyze, subtasks: [{ title: Danh sách đơn hàng, skills: [api-design] }] }]
  - stage: dev
    title: '^Danh sách đơn hàng$'
    steps:
      - macro: preflight
      - tool: mcp__tickets__update_status
        input: { to: in_progress }
      - tool: Read
        input: { file_path: src/app.js }
      - tool: Read
        input: { file_path: docs/index.md }
      - macro: dev_finish
        file: src/orders.js
  - stage: docs_update
    title: '^Danh sách đơn hàng$'
    steps: [{ macro: docs_update, files: [src/orders.js], skills: [api-design] }]
  - stage: dev
    title: '^Sửa: đọc docs trước'
    steps: [{ macro: dev, skills: [api-design], file: src/orders-fix.js }]
  - stage: docs_update
    title: '^Sửa: đọc docs trước'
    steps: [{ macro: docs_update, files: [src/orders-fix.js] }]
  - stage: qc
    steps: [{ macro: qc }]
  - stage: pm_accept
    run: 1
    steps:
      - macro: pm_accept
        tryMerge: true
        reject:
          - title: Danh sách đơn hàng
            bug: 'Sửa: đọc docs trước và dùng skill api-design'
            reason: docs_first=false và bỏ qua skill bắt buộc api-design.
  - stage: pm_accept
    run: 2
    steps: [{ macro: pm_accept }]
  - stage: assistant_close
    steps: [{ macro: close }]
expect:
  tickets:
    - { title: '^Trang đơn hàng$', type: pm_task, status: done }
    - { title: '^Sửa: đọc docs trước', type: bug, status: done }
    - { title: '^Kiểm thử lại', type: qc, status: done }
