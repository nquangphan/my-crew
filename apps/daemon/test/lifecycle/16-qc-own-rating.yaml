name: qc-own-rating
description: >-
  The PM rates dev and QC separately (dev large, QC trivial). Dev runs on the model of its rating (opus), QC
  on the model of its own rating (haiku); the bug QC files inherits the dev rating and the retest the QC one,
  test plan (unit) included.
project:
  platform: backend
request:
  title: Đổi cách tính thuế
scripts:
  - stage: assistant_triage
    steps: [{ macro: triage, title: Đổi cách tính thuế }]
  - stage: pm_analyze
    steps:
      - macro: pm_analyze
        subtasks:
          - title: Tính thuế theo vùng
            complexity: large
            reason: Đổi lõi tính giá ở nhiều module
            qcComplexity: trivial
            qcReason: Một hàm thuần, kiểm bằng test đơn vị
            testKinds: [unit]
            testReason: Hàm thuần không có giao diện, test đơn vị của repo là đủ
  - stage: dev
    title: '^Tính thuế theo vùng$'
    steps: [{ macro: dev, file: src/tax.js }]
  - stage: docs_update
    title: '^Tính thuế theo vùng$'
    steps: [{ macro: docs_update, files: [src/tax.js] }]
  - stage: qc
    title: '^QC: Tính thuế'
    steps: [{ macro: qc, bugs: [Lỗi làm tròn thuế] }]
  - stage: dev
    title: '^Lỗi làm tròn thuế$'
    steps: [{ macro: dev, file: src/tax-fix.js }]
  - stage: docs_update
    title: '^Lỗi làm tròn thuế$'
    steps: [{ macro: docs_update, files: [src/tax-fix.js] }]
  - stage: qc
    title: '^Kiểm thử lại'
    steps: [{ macro: qc }]
  - stage: pm_accept
    steps: [{ macro: pm_accept }]
  - stage: assistant_close
    steps: [{ macro: close }]
expect:
  tickets:
    - { title: '^Đổi cách tính thuế$', type: pm_task, status: done }
    - { title: '^Tính thuế theo vùng$', status: done }
    - { title: '^Lỗi làm tròn thuế$', type: bug, status: done }
    - { title: '^Kiểm thử lại', status: done }
