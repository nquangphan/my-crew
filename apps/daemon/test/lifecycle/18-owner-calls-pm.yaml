name: owner-calls-pm
description: >-
  A dev ticket loses its rating (like one created before the PM had to rate subtasks), so after the owner
  answers its question the run cannot choose a model and the ticket is blocked. The owner tags @pm in a comment
  on that dev ticket: only the PM wakes, rates the ticket in place with rate_subtask and replies on it, and the
  dev reruns on the new rating and the tree finishes.
project:
  platform: backend
request:
  title: Tính thuế đơn hàng
owner:
  - when: { title: '^Áp thuế vào đơn hàng$', type: dev, status: needs_input }
    clearRating: true
    comment: Dùng thuế suất 10% cho mọi đơn.
  - when: { title: '^Áp thuế vào đơn hàng$', type: dev, status: blocked, comment: 'chưa được PM đánh giá' }
    comment: '@pm ticket này chưa được đánh giá độ phức tạp, đánh giá giúp rồi cho chạy lại.'
scripts:
  - stage: assistant_triage
    steps: [{ macro: triage, title: Tính thuế đơn hàng }]
  - stage: pm_analyze
    steps:
      - macro: pm_analyze
        subtasks:
          - title: Áp thuế vào đơn hàng
            complexity: small
            reason: Một hàm tính thuế và test của nó
            qcComplexity: trivial
            qcReason: Kiểm bằng test đơn vị
  - stage: dev
    title: '^Áp thuế vào đơn hàng$'
    run: 1
    steps:
      - macro: dev_start
      - tool: mcp__tickets__ask_owner
        input: { question: Thuế suất bao nhiêu? }
  - stage: pm_monitor
    steps:
      - macro: preflight
      - tool: mcp__tickets__rate_subtask
        input:
          ticket: '@{key:^Áp thuế vào đơn hàng$}'
          complexity: medium
          complexityReason: Thuế áp lên tổng đơn, ảnh hưởng thanh toán và hoá đơn
      - tool: mcp__tickets__comment
        input:
          ticket: '@{key:^Áp thuế vào đơn hàng$}'
          body: PM đã đánh giá độ phức tạp medium; ticket chạy lại trên model theo mức này.
  - stage: dev
    title: '^Áp thuế vào đơn hàng$'
    run: 2
    steps: [{ macro: dev_finish, file: src/tax.js }]
  - stage: docs_update
    title: '^Áp thuế vào đơn hàng$'
    steps: [{ macro: docs_update, files: [src/tax.js] }]
  - stage: qc
    title: '^QC: '
    steps: [{ macro: qc }]
  - stage: pm_accept
    steps: [{ macro: pm_accept }]
  - stage: assistant_close
    steps: [{ macro: close }]
expect:
  tickets:
    - { title: '^Tính thuế đơn hàng$', type: pm_task, status: done }
    - { title: '^Áp thuế vào đơn hàng$', type: dev, count: 1, status: done }
    - { title: '^QC: Áp thuế vào đơn hàng$', type: qc, status: done }
