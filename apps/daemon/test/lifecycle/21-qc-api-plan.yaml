name: qc-api-plan
description: >-
  A web project whose change is API-only: the PM plans the QC with testKinds api + integration, so the QC
  ticket carries no UI-test MCP. Playwright is not connected on this machine, yet QC is not blocked, follows
  the plan, closes without calling any UI MCP tool, and the whole tree finishes.
inventory:
  mcpServers: [{ name: playwright, status: failed }]
request:
  title: Thêm API danh sách đơn hàng
  description: Cần endpoint trả danh sách đơn hàng, chưa làm giao diện.
scripts:
  - stage: assistant_triage
    steps: [{ macro: triage, title: Thêm API danh sách đơn hàng }]
  - stage: pm_analyze
    steps:
      - macro: pm_analyze
        subtasks:
          - title: Route danh sách đơn hàng
            complexity: small
            qcComplexity: small
            qcReason: Hai loại kiểm thử, một endpoint
            testKinds: [api, integration]
            testReason: Thay đổi chỉ có route và truy vấn DB, không có giao diện nên không cần trình duyệt
  - stage: dev
    steps: [{ macro: dev, file: src/orders.js }]
  - stage: docs_update
    steps: [{ macro: docs_update, files: [src/orders.js] }]
  - stage: qc
    steps:
      - macro: qc
        summary: 'pass. api: GET /orders trả 200 và đúng danh sách; integration: node --test đạt.'
  - stage: pm_accept
    steps: [{ macro: pm_accept }]
  - stage: assistant_close
    steps: [{ macro: close }]
expect:
  tickets:
    - { title: '^Thêm API danh sách đơn hàng$', type: request, status: in_review }
    - { title: '^Thêm API danh sách đơn hàng$', type: pm_task, status: done }
    - { title: '^Route danh sách đơn hàng$', type: dev, status: done }
    - { title: '^QC: Route danh sách đơn hàng$', type: qc, status: done }
