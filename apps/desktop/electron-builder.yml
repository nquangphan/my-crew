# 2P Crew desktop packaging, run by `pnpm --filter @crew/desktop package:mac` (scripts/package-mac.mjs),
# which stages the bundled code, the crew-docs resource and a flat npm node_modules with only the runtime
# externals outside the workspace and builds from there.
appId: com.2p-solutions.crew
productName: 2P Crew
copyright: Copyright © 2P Solutions
directories:
  output: release
  buildResources: build
# Plain files: the Agent SDK spawns its Claude Code binary and better-sqlite3 loads its .node file from disk.
asar: false
npmRebuild: true
mac:
  # One dmg and one zip per architecture: each app carries only its own Electron, Claude Code binary and
  # native modules (package-mac.mjs drops the other architecture's copies after packing, before signing and
  # before either target is made). The dmg is for people; the zip is what electron-updater (Squirrel.Mac)
  # installs once the app is Developer ID signed.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # The zips (the dmg has its own name below): 2P-Crew-<version>-arm64-mac.zip and 2P-Crew-<version>-x64-mac.zip,
  # listed in latest-mac.yml; electron-updater picks the arm64 one by the `arm64` in its name.
  artifactName: 2P-Crew-${version}-${arch}-mac.${ext}
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Ad-hoc signature: no Developer ID certificate yet. The app runs after right-click → Open on first launch,
  # and updates fall back to a download link. See docs/flows/desktop-app.md for the signing and notarizing
  # step (CSC_LINK / CSC_KEY_PASSWORD, identity, hardenedRuntime, notarize).
  identity: "-"
  # The hardened runtime is for Developer ID builds; with an ad-hoc signature it blocks loading native
  # modules (library validation). Turn it on together with the signing identity.
  hardenedRuntime: false
  extendInfo:
    NSHumanReadableCopyright: Copyright © 2P Solutions
dmg:
  title: 2P Crew ${version}
  # 2P-Crew-<version>-arm64.dmg and 2P-Crew-<version>-x64.dmg; the updater's download link
  # (src/main/updater.ts dmgAssetName) and electron-updater's arm64 pick rely on this name.
  artifactName: 2P-Crew-${version}-${arch}.${ext}
publish:
  provider: github
  owner: nquangphan
  repo: my-crew
  releaseType: release
