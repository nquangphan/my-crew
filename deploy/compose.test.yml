# Test layer over deploy/compose.yml for the E2E suite (e2e/): the same images and wiring, plus an edge
# nginx that renders deploy/nginx/crew-http.conf exactly as scripts/attach-nginx.sh does, published on
# 127.0.0.1 only. Never used on the VPS.
#
#   CREW_PROJECT=crew-e2e CREW_COMPOSE_EXTRA=deploy/compose.test.yml scripts/deploy.sh
services:
  crew-api:
    environment:
      # Plain HTTP on 127.0.0.1, and many logins in a row.
      COOKIE_SECURE: 'false'
      LOGIN_RATE_LIMIT_PER_MINUTE: '1000'
      LOG_LEVEL: warn

  crew-backup:
    # Not needed by the E2E run; start it with --profile backup when a test wants it.
    profiles: [backup]

  crew-edge:
    image: nginx:alpine
    entrypoint:
      - /bin/sh
      - -c
      - >-
        rm -f /etc/nginx/conf.d/default.conf &&
        sh /crew/scripts/lib/render-nginx.sh http "$$CREW_DOMAIN" /crew/deploy/nginx > /etc/nginx/conf.d/crew.conf &&
        exec nginx -g 'daemon off;'
    environment:
      CREW_DOMAIN: ${CREW_DOMAIN:?set CREW_DOMAIN}
    volumes:
      - ../deploy/nginx:/crew/deploy/nginx:ro
      - ../scripts/lib/render-nginx.sh:/crew/scripts/lib/render-nginx.sh:ro
    ports:
      - 127.0.0.1:${CREW_EDGE_PORT:-18180}:80
    networks: [crew-net]
    depends_on:
      crew-api: { condition: service_healthy }
      crew-web: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/v1/health']
      interval: 5s
      timeout: 3s
      retries: 12
