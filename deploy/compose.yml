# 2P Crew VPS stack. Run through scripts/deploy.sh from the deploy root (/opt/crew):
#   docker compose -p crew -f deploy/compose.yml --env-file .env ...
#
# No service publishes a host port. The shared edge nginx of the VPS joins the `crew-net` network
# (crew_crew-net for project `crew`) and proxies to crew-api:8787 and crew-web:8080; see
# scripts/attach-nginx.sh. Postgres and the backup job sit on the internal `crew-db` network only.
name: crew

x-common: &common
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

services:
  crew-postgres:
    <<: *common
    image: postgres:17
    environment:
      POSTGRES_USER: crew
      POSTGRES_DB: crew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - crew-pgdata:/var/lib/postgresql/data
    networks: [crew-db]
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crew -d crew']
      interval: 5s
      timeout: 3s
      retries: 30

  crew-api:
    <<: *common
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    image: crew-api:latest
    environment:
      DATABASE_URL: postgres://crew:${POSTGRES_PASSWORD}@crew-postgres:5432/crew
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
      HOST: 0.0.0.0
      PORT: '8787'
      # Only the edge nginx and crew containers can reach the API (no host port), so the private address
      # ranges are the proxy hops to trust for X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
      BUDGET_TIMEZONE: Asia/Ho_Chi_Minh
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      crew-postgres: { condition: service_healthy }
    networks: [crew-net, crew-db]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  crew-web:
    <<: *common
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    image: crew-web:latest
    networks: [crew-net]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 6

  crew-backup:
    <<: *common
    build: { context: .., dockerfile: deploy/Dockerfile, target: backup }
    image: crew-backup:latest
    environment:
      PGHOST: crew-postgres
      PGUSER: crew
      PGDATABASE: crew
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - crew-backups:/backups
    depends_on:
      crew-postgres: { condition: service_healthy }
    networks: [crew-db]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD', 'pg_isready', '-q']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  # Joined by the shared edge nginx; the name is <project>_crew-net.
  crew-net: {}
  crew-db:
    internal: true

volumes:
  crew-pgdata: {}
  crew-backups: {}
