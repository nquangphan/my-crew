# 2P Crew on the shared edge nginx, plain HTTP (before the certificate exists). Template: rendered by
# scripts/lib/render-nginx.sh, which fills in the domain and the locations marker.
server {
  listen 80;
  server_name __CREW_DOMAIN__;

  # certbot webroot (volume 2ps-landing_certbot-www), used to issue the certificate.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # @crew-locations
}
