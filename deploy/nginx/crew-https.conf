# 2P Crew on the shared edge nginx, HTTPS. Template: rendered by scripts/lib/render-nginx.sh, which fills in the
# domain and the locations marker. The certificate comes from the shared certbot container
# (volume 2ps-landing_certbot-conf mounted at /etc/letsencrypt).
server {
  listen 80;
  server_name __CREW_DOMAIN__;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name __CREW_DOMAIN__;

  ssl_certificate /etc/letsencrypt/live/__CREW_DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__CREW_DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:crew_ssl:10m;
  ssl_session_timeout 1d;

  # Server level only: the locations below set no add_header, so they inherit it.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # @crew-locations
}
