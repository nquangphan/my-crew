# Local development and test database for 2P Crew.
# Start: docker compose -f docker-compose.dev.yml up -d
# Host port 55432 avoids clashing with other local Postgres instances on 5432.
name: crew-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: crew-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crew
      POSTGRES_PASSWORD: crew
      POSTGRES_DB: crew
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - crew-dev-pgdata:/var/lib/postgresql/data
      - ./apps/api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crew -d crew']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  crew-dev-pgdata:
