# Manifest flow ↔ file của repo 2P Crew (nguồn sự thật). Chuẩn: packages/docs-kit/STANDARD.md.
# Các mục source, shared, unassigned được bảo vệ (luật R6): chỉ đổi khi chủ dự án cho phép.
version: 1
source:
  include:
    - "apps/*/src/**"
    - "packages/*/src/**"
    - "packages/docs-kit/templates/**"
  exclude:
    - "**/*.test.*"
    - "**/test/**"
    - "**/dist/**"
    - "**/generated/**"
flows:
  docs-check:
    title: Kiểm tra chuẩn docs (crew-docs)
    doc: docs/flows/docs-check.md
    entrypoints:
      - packages/docs-kit/src/bin.ts
      - packages/docs-kit/src/cli.ts
    files:
      - packages/docs-kit/src/commands/check.ts
      - packages/docs-kit/src/commands/init.ts
      - packages/docs-kit/src/commands/generate.ts
      - packages/docs-kit/src/commands/where.ts
      - packages/docs-kit/src/commands/flow.ts
      - packages/docs-kit/src/commands/lookup.ts
      - packages/docs-kit/src/commands/io.ts
      - packages/docs-kit/src/git.ts
      - packages/docs-kit/src/tree.ts
      - packages/docs-kit/src/flows-schema.ts
      - packages/docs-kit/src/manifest.ts
      - packages/docs-kit/src/generate.ts
      - packages/docs-kit/src/secret-scan.ts
      - packages/docs-kit/src/rules/types.ts
      - packages/docs-kit/src/rules/r1-manifest.ts
      - packages/docs-kit/src/rules/r2-coverage.ts
      - packages/docs-kit/src/rules/r3-freshness.ts
      - packages/docs-kit/src/rules/r4-generated.ts
      - packages/docs-kit/src/rules/r5-initialized.ts
      - packages/docs-kit/src/rules/r6-protected.ts
      - packages/docs-kit/src/rules/r7-secrets.ts
      - packages/docs-kit/src/templates.ts
      - packages/docs-kit/src/version.ts
      - packages/docs-kit/src/raw-imports.d.ts
      - packages/docs-kit/templates/AGENTS.md
      - packages/docs-kit/templates/index.md
      - packages/docs-kit/templates/architecture.md
      - packages/docs-kit/templates/flow.md
      - packages/docs-kit/templates/flows.yaml
    tests:
      - packages/docs-kit/test/rules.test.ts
      - packages/docs-kit/test/flows-schema.test.ts
  docs-hooks:
    title: Hook git và CI của crew-docs
    doc: docs/flows/docs-hooks.md
    entrypoints:
      - packages/docs-kit/src/commands/install-hooks.ts
      - packages/docs-kit/src/commands/ci-workflow.ts
    files:
      - packages/docs-kit/src/hook-installer.ts
      - packages/docs-kit/templates/crew-docs.yml
    tests:
      - packages/docs-kit/test/hook-installer.test.ts
  mac-setup:
    title: Cài và kiểm Mac chạy agent (crew-mac)
    doc: docs/flows/mac-setup.md
    entrypoints:
      - apps/crew-mac/src/cli.ts
    files:
      - apps/crew-mac/src/system.ts
      - apps/crew-mac/src/context.ts
      - apps/crew-mac/src/context-factory.ts
      - apps/crew-mac/src/index.ts
      - apps/crew-mac/src/paths.ts
      - apps/crew-mac/src/fs-util.ts
      - apps/crew-mac/src/manifest.ts
      - apps/crew-mac/src/sshd-owner.ts
      - apps/crew-mac/src/zshenv.ts
      - apps/crew-mac/src/authorized-keys.ts
      - apps/crew-mac/src/plist.ts
      - apps/crew-mac/src/sshd-config.ts
      - apps/crew-mac/src/launchctl.ts
      - apps/crew-mac/src/tailscale.ts
      - apps/crew-mac/src/wrapper.ts
      - apps/crew-mac/src/launcher.ts
      - apps/crew-mac/src/commands/setup.ts
      - apps/crew-mac/src/commands/doctor.ts
      - apps/crew-mac/src/commands/uninstall.ts
      - apps/crew-mac/src/commands/status.ts
      - apps/crew-mac/src/status/sign.ts
      - apps/crew-mac/src/status/report.ts
      - apps/crew-mac/src/status/tcc.ts
      - apps/crew-mac/src/status/docs.ts
    tests:
      - apps/crew-mac/test/system.test.ts
      - apps/crew-mac/test/zshenv.test.ts
      - apps/crew-mac/test/authorized-keys.test.ts
      - apps/crew-mac/test/render.test.ts
      - apps/crew-mac/test/system-wrappers.test.ts
      - apps/crew-mac/test/crew-claude-run.test.ts
      - apps/crew-mac/test/launcher.test.ts
      - apps/crew-mac/test/sshd-owner.test.ts
      - apps/crew-mac/test/setup.test.ts
      - apps/crew-mac/test/doctor.test.ts
      - apps/crew-mac/test/uninstall.test.ts
      - apps/crew-mac/test/cli.test.ts
      - apps/crew-mac/test/index.test.ts
      - apps/crew-mac/test/status.test.ts
      - apps/crew-mac/test/status-tcc.test.ts
      - apps/crew-mac/test/status-docs.test.ts
  mac-orphan-reaper:
    title: Dừng process của run và dọn process mồ côi trên Mac (crew-mac stop-run, reap)
    doc: docs/flows/mac-orphan-reaper.md
    entrypoints:
      - apps/crew-mac/src/commands/stop-run.ts
      - apps/crew-mac/src/reaper/reap.ts
    files:
      - apps/crew-mac/src/reaper/run-members.ts
      - apps/crew-mac/src/reaper/stop.ts
      - apps/crew-mac/src/reaper/process-table.ts
      - apps/crew-mac/src/reaper/select.ts
    tests:
      - apps/crew-mac/test/run-members.test.ts
      - apps/crew-mac/test/stop.test.ts
      - apps/crew-mac/test/stop-run.test.ts
      - apps/crew-mac/test/reaper-select.test.ts
      - apps/crew-mac/test/reaper-reap.test.ts
  mac-workflows:
    title: Ghim Superpowers và chặn nạp skill chéo trên Mac
    doc: docs/flows/mac-workflows.md
    entrypoints:
      - apps/crew-mac/src/workflows/install.ts
      - apps/crew-mac/src/commands/workflow-check.ts
    files:
      - apps/crew-mac/src/workflows/pin.ts
      - apps/crew-mac/src/workflows/policy.ts
      - apps/crew-mac/src/workflows/tree-checksum.ts
      - apps/crew-mac/src/workflows/inventory.ts
      - apps/crew-mac/src/workflows/run-init.ts
    tests:
      - apps/crew-mac/test/workflows-pin.test.ts
      - apps/crew-mac/test/workflows-inventory.test.ts
      - apps/crew-mac/test/workflow-check.test.ts
shared: {}
unassigned: []
