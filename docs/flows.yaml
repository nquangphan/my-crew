# Manifest flow ↔ file của repo 2P Crew (nguồn sự thật). Chuẩn: packages/docs-kit/STANDARD.md.
# Các mục source, shared, unassigned được bảo vệ (luật R6): chỉ đổi khi chủ dự án cho phép.
version: 1
source:
  include:
    - "apps/*/src/**"
    - "packages/*/src/**"
    - "apps/api/drizzle/*.sql"
    - "packages/docs-kit/templates/**"
