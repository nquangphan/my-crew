# Daemon under test for the E2E suite: the machine that hosts the assistant. It runs the real daemon
# (stream, dispatcher, scheduler, role planner, ticket tools) with scripted agent runs instead of a model,
# so the suite costs nothing. run-daemon.ts adds apiUrl and machineId, and fills in @{project} (the id of the
# project to route to) and @{key} (the ticket key) in step inputs.
daemon:
  machineName: e2e-assistant
  projects: []
  resources: { maxConcurrentJobs: 2, minFreeMemGb: 0, maxLoadPerCpu: 64 }

# One entry per role step and run number on the same ticket (1 = first run of that step).
scripts:
  # A new request: the assistant starts triage, then asks the owner one question (-> needs_input).
  - stage: assistant_triage
    run: 1
    steps:
      - tool: mcp__tickets__select_capabilities
        input: { skills: [], mcps: [], noneReason: không có skill hay MCP nào hợp với bước định tuyến }
      - tool: mcp__tickets__update_status
        input: { to: triage }
      - tool: mcp__tickets__ask_owner
        input: { question: 'Trợ lý hỏi: yêu cầu @{key} thuộc dự án Shop API phải không?' }

  # After the owner's answer (the server moves the request back to in_progress): route it to the project.
  - stage: assistant_triage
    run: 2
    steps:
      - tool: mcp__tickets__select_capabilities
        input: { skills: [], mcps: [], noneReason: không có skill hay MCP nào hợp với bước định tuyến }
      - tool: mcp__tickets__get_project_catalog
      - tool: mcp__tickets__create_pm_ticket
        input:
          projectId: '@{project}'
          title: 'Phân tích @{key}'
          description: "**Mục tiêu:** làm theo yêu cầu.\n**Phạm vi:** Shop API.\n**Gợi ý nghiệm thu:** có test."
      - tool: mcp__tickets__comment
        input: { body: 'Đã định tuyến @{key} tới dự án Shop API.' }
