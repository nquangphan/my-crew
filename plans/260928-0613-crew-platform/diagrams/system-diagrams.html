<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Sơ đồ hệ thống 2P Crew</title>
<style>
:root{--bg:#f7f6f2;--ink:#1c2230;--muted:#5d6574;--line:#d9d6cc;--accent:#1d5fd1;--stop:#c23a2f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181e;--ink:#e3e6ec;--muted:#9aa2b1;--line:#30353f;--accent:#6b9cf2;--stop:#f0776c}}
:root[data-theme="dark"]{--bg:#15181e;--ink:#e3e6ec;--muted:#9aa2b1;--line:#30353f;--accent:#6b9cf2;--stop:#f0776c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.55}
main{max-width:1240px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:26px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 28px;max-width:760px}
figure{margin:0 0 44px;padding:20px 0 0;border-top:1px solid var(--line)}
h2{font-size:18px;margin:0 0 14px}
svg{width:100%;height:auto;display:block;color:var(--ink);font-size:12px;font-family:inherit}
.acc{color:var(--accent)}
.stop{color:var(--stop)}
figcaption{color:var(--muted);font-size:14px;margin-top:12px;max-width:900px}
</style>
</head>
<body>
<main>
<h1>Sơ đồ hệ thống 2P Crew</h1>
<p class="lead">Ba cơ chế cốt lõi của plan: dữ liệu đi giữa VPS và máy local thế nào, ticket chuyển qua các agent ra sao, và cổng kiểm tra giữ docs luôn khớp code.</p>

<figcaption>Mũi tên xanh là kênh quan trọng nhất. Máy local tự mở kết nối SSE ra VPS nên chạy được sau NAT, không cần mở port. Server phát lại mọi event có id lớn hơn cursor mà máy đã lưu, nên mất mạng hay crash cũng không mất việc. Máy ghi ngược bằng REST kèm Idempotency-Key để chạy lại không tạo bản ghi trùng. Trên VPS, mỗi thay đổi ghi ticket và event trong cùng một transaction, rồi NOTIFY đánh thức luồng SSE.</figcaption>

<figure>

<defs>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
</defs>
<g fill="none" stroke="currentColor" stroke-width="1.5">

<figcaption>Đường nét đứt xanh là vòng hỏi đáp: PM hỏi bằng comment, ticket chuyển sang "chờ bạn", bạn trả lời thì server đánh thức lại đúng session của PM. Mỗi task dev có một task QC đi kèm. QC tìm thấy lỗi thì tạo ticket bug mới cho dev, sau 3 vòng vẫn lỗi thì PM hỏi lại bạn. Các bước chuyển (dev done, children.all_done) do server phát event, không agent nào phải tự hỏi thăm trạng thái.</figcaption>

<text class="stop" x="480" y="210" text-anchor="middle" fill="currentColor">R3 thiếu doc flow · R6 sửa .claude/hook · R7 lộ secret · test đỏ</text>
</svg>
<figcaption>Mũi tên đỏ là đường bị chặn. Commit nào đổi file code mà không đổi file doc của flow chứa file đó sẽ bị pre-commit chặn (R3). Pre-push chạy lại cho cả dải commit cùng test và quét secret. Nếu ai đó bỏ qua hook bằng --no-verify, CI trên GitHub vẫn chạy cùng kiểm tra và báo đỏ. Commit khởi tạo docs lần đầu (có trailer Crew-Docs-Init) là ngoại lệ duy nhất.</figcaption>
