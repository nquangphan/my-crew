version: 1
source:
  include:
    - src/**
    - server/src/**
    - server/scripts/**
    - server/migrations/**
  exclude: []
flows:
  domain-foundation:
    title: Hợp đồng miền Crew v2
    doc: docs/flows/domain-foundation.md
    entrypoints: []
    files:
      - src/model-policy.ts
      - src/workflow-policy.ts
      - src/ticket-policy.ts
      - src/completion-policy.ts
    tests:
      - test/workspace.test.ts
      - test/model-policy.test.ts
      - test/workflow-policy.test.ts
      - test/ticket-policy.test.ts
      - test/completion-policy.test.ts
  server-platform:
    title: Nền tảng server và database riêng Crew v2
    doc: docs/flows/server-platform.md
    entrypoints:
      - server/src/db/migrate.ts
    files:
      - server/src/platform/config.ts
      - server/src/platform/contracts.ts
      - server/src/platform/errors.ts
      - server/src/platform/picomatch.d.ts
      - server/src/platform/thread-stream.d.ts
      - server/src/db/client.ts
      - server/scripts/test-db-signals.mjs
      - server/scripts/test-db.ts
      - server/migrations/001_platform.sql
      - server/package.json
      - server/tsconfig.json
    tests:
      - server/test/platform.test.ts
      - server/test/support/db.ts
  server-journal:
    title: Mutation và event journal bền vững Crew v2
    doc: docs/flows/server-journal.md
    entrypoints:
      - server/src/journal/routes.ts
    files:
      - server/src/journal/canonical.ts
      - server/src/journal/event-contracts.ts
      - server/src/journal/events.ts
      - server/src/journal/mutation.ts
      - server/migrations/002_journal.sql
    tests:
      - server/test/journal-scope.test.ts
      - server/test/journal.test.ts
  server-identity:
    title: Xác thực owner và gắn dự án với máy Crew v2
    doc: docs/flows/server-identity.md
    entrypoints:
      - server/src/auth/routes.ts
      - server/src/projects/routes.ts
    files:
      - server/src/auth/bootstrap.ts
      - server/src/auth/machine.ts
      - server/src/auth/password.ts
      - server/src/auth/session.ts
      - server/src/projects/service.ts
      - server/migrations/003_identity.sql
    tests:
      - server/test/auth.test.ts
      - server/test/projects.test.ts
      - server/test/support/identity-app.ts
shared: {}
unassigned: []
