version: 1
source:
  include:
    - src/**
    - server/src/**
    - server/scripts/**
    - server/migrations/**
    - gateway/src/**
    - desktop/src/**
  exclude: []
flows:
  domain-foundation:
    title: Hợp đồng miền Crew v2
    doc: docs/flows/domain-foundation.md
    entrypoints: []
    files:
      - src/model-policy.ts
      - src/workflow-policy.ts
      - src/ticket-policy.ts
      - src/completion-policy.ts
    tests:
      - test/workspace.test.ts
      - test/model-policy.test.ts
      - test/workflow-policy.test.ts
      - test/ticket-policy.test.ts
      - test/completion-policy.test.ts
  server-platform:
    title: Nền tảng server và database riêng Crew v2
    doc: docs/flows/server-platform.md
    entrypoints:
      - server/src/db/migrate.ts
    files:
      - server/src/platform/config.ts
      - server/src/platform/contracts.ts
      - server/src/platform/errors.ts
      - server/src/platform/picomatch.d.ts
      - server/src/platform/thread-stream.d.ts
      - server/src/db/client.ts
      - server/scripts/test-db-signals.mjs
      - server/scripts/test-db.ts
      - server/migrations/001_platform.sql
      - server/package.json
      - server/tsconfig.json
    tests:
      - server/test/platform.test.ts
      - server/test/support/db.ts
  server-journal:
    title: Mutation và event journal bền vững Crew v2
    doc: docs/flows/server-journal.md
    entrypoints:
      - server/src/journal/routes.ts
    files:
      - server/src/journal/canonical.ts
      - server/src/journal/event-contracts.ts
      - server/src/journal/events.ts
      - server/src/journal/mutation.ts
      - server/migrations/002_journal.sql
    tests:
      - server/test/journal-scope.test.ts
      - server/test/journal.test.ts
  server-identity:
    title: Xác thực owner và gắn dự án với máy Crew v2
    doc: docs/flows/server-identity.md
    entrypoints:
      - server/src/auth/routes.ts
      - server/src/projects/routes.ts
    files:
      - server/src/auth/bootstrap.ts
      - server/src/auth/machine.ts
      - server/src/auth/password.ts
      - server/src/auth/session.ts
      - server/src/projects/service.ts
      - server/migrations/003_identity.sql
    tests:
      - server/test/auth.test.ts
      - server/test/projects.test.ts
      - server/test/support/identity-app.ts
  server-docs-import:
    title: Kiểm tra snapshot tài liệu và nhập nguyên trạng Crew v2
    doc: docs/flows/server-docs-import.md
    entrypoints:
      - server/scripts/docs-import.ts
      - server/src/docs/validator.ts
    files:
      - server/src/docs/checksum.ts
      - server/src/docs/contracts.ts
      - server/src/docs/import.ts
      - server/src/docs/links.ts
      - server/src/docs/manifest.ts
      - server/migrations/006_docs.sql
    tests:
      - server/test/docs-events.unit.test.ts
      - server/test/docs-import-cli.unit.test.ts
      - server/test/docs-import.test.ts
      - server/test/docs-validator.unit.test.ts
      - server/test/support/docs.ts
      - server/test/fixtures/legacy-docs/crlf-unicode.md
  server-tickets:
    title: Cây ticket, phụ thuộc và bằng chứng hoàn tất
    doc: docs/flows/server-tickets.md
    entrypoints:
      - server/src/tickets/routes.ts
    files:
      - server/src/tickets/completion.ts
      - server/src/tickets/contracts.ts
      - server/src/tickets/decisions.ts
      - server/src/tickets/dependencies.ts
      - server/src/tickets/deploy.ts
      - server/src/tickets/docs-links.ts
      - server/src/tickets/repair.ts
      - server/src/tickets/service.ts
      - server/migrations/004_tickets.sql
    tests:
      - server/test/tickets.test.ts
      - server/test/dependencies.test.ts
      - server/test/completion.test.ts
      - server/test/repair.test.ts
      - server/test/support/tickets.ts
      - server/test/ticket-events.unit.test.ts
      - server/test/deploy.test.ts
  gateway-host:
    title: Host cổng macOS Crew v2
    doc: docs/flows/gateway-host.md
    entrypoints:
      - gateway/src/host/main.ts
    files:
      - gateway/src/host/gateway-host.ts
      - gateway/src/host/process-lock.ts
      - gateway/src/host/status.ts
      - gateway/src/ipc/server.ts
      - gateway/src/journal/atomic-records.ts
      - gateway/src/journal/gated-helper.ts
      - gateway/src/journal/http-operations.ts
      - gateway/src/journal/native-identity.c
      - gateway/src/journal/native.ts
      - gateway/src/journal/process-journal.ts
      - gateway/src/resources/native-resources.c
      - gateway/src/resources/registry.ts
      - gateway/src/telemetry/capacity.ts
      - gateway/src/telemetry/macos-provider.ts
      - gateway/package.json
      - gateway/pnpm-lock.yaml
      - gateway/tsconfig.json
      - gateway/tsconfig.build.json
    tests:
      - gateway/test/host-failures.test.ts
      - gateway/test/host-lifecycle.test.ts
      - gateway/test/http-operations.test.ts
      - gateway/test/journal.test.ts
      - gateway/test/resources.test.ts
      - gateway/test/support/host.ts
      - gateway/test/support/journal-fixture.ts
      - gateway/test/support/owned-run.ts
      - gateway/test/support/ui-client.ts
      - gateway/test/telemetry.test.ts
  desktop-shell:
    title: Giao diện cổng Crew v2 trên macOS
    doc: docs/flows/desktop-shell.md
    entrypoints:
      - desktop/src/main/index.ts
    files:
      - desktop/src/main/client.ts
      - desktop/src/main/security.ts
      - desktop/src/preload/index.cjs
      - desktop/src/preload/index.d.cts
      - desktop/src/renderer/index.html
      - desktop/src/renderer/index.js
      - desktop/src/renderer/style.css
      - desktop/package.json
      - desktop/pnpm-lock.yaml
      - desktop/tsconfig.json
      - desktop/tsconfig.build.json
    tests:
      - desktop/test/electron-lifecycle.test.ts
      - desktop/test/shell.test.ts
  server-execution:
    title: Command, attempt và quyền thực thi có fencing
    doc: docs/flows/server-execution.md
    entrypoints:
      - server/src/execution/routes.ts
    files:
      - server/src/execution/attempts.ts
      - server/src/execution/commands.ts
      - server/src/execution/contracts.ts
      - server/src/execution/reconcile.ts
      - server/migrations/005_execution.sql
    tests:
      - server/test/commands.test.ts
      - server/test/attempts.test.ts
      - server/test/execution-events.unit.test.ts
      - server/test/support/execution.ts
shared: {}
unassigned: []
